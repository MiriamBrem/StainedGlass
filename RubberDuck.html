<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rubber Ducky</title>

    <!-- Google font for a cleaner look -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
      :root{
        --max-width:700px;
        --accent:#222;
        --muted:#666;
        --frame-wood-1:#d2b07a;
        --frame-wood-2:#e9d7be;
        --lead:#2b2b2b;
      }

      html,body{
        height:100%;
      }

      body{
        margin:0;
        padding:2rem;
        background:
          radial-gradient(1200px 600px at 10% 10%, rgba(60,50,40,0.03), transparent 10%),
          linear-gradient(180deg,#f6f7fb 0%, #f2f3f7 100%);
        font-family:"Merriweather", Georgia, serif;
        color:var(--accent);
        display:flex;
        justify-content:center;
        align-items:flex-start;
      }

      /* outer frame that suggests a wooden picture frame */
      .frame{
        width:100%;
        max-width:var(--max-width);
        padding:14px; /* visible frame thickness */
        border-radius:18px;
        background: linear-gradient(90deg, var(--frame-wood-1), var(--frame-wood-2) 40%, var(--frame-wood-1));
        box-shadow:
          0 18px 50px rgba(20,20,30,0.08),
          inset 0 6px 14px rgba(255,255,255,0.15);
        display:block;
      }

      /* subtle wood grain using a repeating gradient */
      .frame::before{
        content:"";
        display:block;
        position:relative;
        pointer-events:none;
        height:100%;
        width:100%;
        border-radius:12px;
        background-image: repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.02) 0px,
          rgba(255,255,255,0.02) 6px,
          rgba(0,0,0,0.02) 12px
        );
        mix-blend-mode:overlay;
      }

      /* inner card that contains the content; the dark border mimics lead came */
      .card{
        width:100%;
        background: linear-gradient(180deg,#ffffff 0%, #fbfbfb 100%);
        border-radius:10px;
        padding:1.25rem;
        box-shadow: 0 8px 28px rgba(20,20,30,0.06);
        border:6px solid var(--lead); /* thin lead-like border around glass */
        position:relative;
      }

      h1{
        font-size:2.4rem;
        margin:0 0 0.6rem 0;
        line-height:1.05;
        letter-spacing:0.2px;
      }

      figure{
        margin:1rem 0;
        text-align:center;
      }

      img.standard{
        width:100%;
        max-width:620px;
        height:auto;
        display:block;
        margin:0 auto;
        border-radius:6px;
        box-shadow:0 14px 40px rgba(0,0,0,0.18);
        object-fit:cover;
      }

      figcaption{
        display:inline-block;
        margin-top:0.6rem;
        font-size:0.95rem;
        color:var(--muted);
        background:linear-gradient(180deg, rgba(0,0,0,0.02), transparent);
        padding:0.45rem 0.75rem;
        border-radius:6px;
      }

      p.description{
        margin-top:1rem;
        line-height:1.6;
        color:#333;
      }

      @media (max-width:480px){
        body{ padding:1rem; }
        .frame{ padding:10px; border-radius:12px; }
        h1{ font-size:1.6rem; }
        img.standard{ box-shadow:0 8px 20px rgba(0,0,0,0.2); }
      }
    </style>
  </head>

  <body>
    <div class="frame">
      <div class="card">
        <h1>Rubber Ducky</h1>

        <figure>
          <img src="RubberDuck.jpg" alt="Yellow rubber duck with an orange beak" class="standard" />
        </figure>

        <p class="description">
          This is Brem's first stained glass piece. It was created to complement the artist's rubber duck collection.
          The duck sports a bright yellow color and a spritely orange beak. This piece features a light-blue tiled
          background with an opaque rubber duck in the mid-ground. Not for sale.
        </p>
      </div>
    </div>
  </body>
</html>
